name: Docker images
on:
  pull_request:
    paths:
      - backend/**
      - frontend/**
      - deploy/**
      - .dockerignore
      - .github/workflows/docker.yml
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release source
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          load: true
          tags: glosano:ci-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/Glosano/glosano
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Test installer failure and retry paths
        run: python3 -m unittest discover -s deploy/tests -p "test_*.py"
      - name: Test the built image
        run: deploy/tests/smoke.sh glosano:ci-${{ matrix.arch }}
      - name: Test release lifecycle
        run: deploy/tests/release.sh glosano:ci-${{ matrix.arch }}
      - name: Test the Linux installer
        run: deploy/tests/install-linux.sh glosano:ci-${{ matrix.arch }}
      - name: Test update and full data recovery
        run: python3 deploy/tests/update-lifecycle.py glosano:ci-${{ matrix.arch }}
      - name: Export the tested image
        if: startsWith(github.ref, 'refs/tags/')
        run: docker save glosano:ci-${{ matrix.arch }} | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: image-${{ matrix.arch }}
          path: image.tar.gz
          retention-days: 2
  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'Glosano/glosano'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: images
      - name: Publish exactly the tested images
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image=ghcr.io/glosano/glosano
          if docker buildx imagetools inspect "$image:$RELEASE_TAG" >/dev/null 2>&1; then
            # Resume a partial publication without ever replacing its image.
            for arch in amd64 arm64; do
              docker pull --platform "linux/$arch" "$image:$RELEASE_TAG"
              revision=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image:$RELEASE_TAG")
              test "$revision" = "$SOURCE_SHA"
            done
            exit 0
          fi
          for arch in amd64 arm64; do
            gzip -dc "images/image-$arch/image.tar.gz" | docker load
            docker tag "glosano:ci-$arch" "$image:$RELEASE_TAG-$arch"
            docker push "$image:$RELEASE_TAG-$arch"
          done
          docker buildx imagetools create -t "$image:$RELEASE_TAG" \
            "$image:$RELEASE_TAG-amd64" "$image:$RELEASE_TAG-arm64"
          docker buildx imagetools inspect "$image:$RELEASE_TAG"
      - name: Verify anonymous pulls before announcing the release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          empty_config=$(mktemp -d)
          for arch in amd64 arm64; do
            docker --config "$empty_config" pull --platform "linux/$arch" "ghcr.io/glosano/glosano:$RELEASE_TAG" || {
              echo 'Set the GHCR package visibility to Public, then re-run the failed jobs.' >&2
              exit 1
            }
          done
      - name: Publish matching installation assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          deploy/package-release.sh "$RELEASE_TAG" release-assets
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Glosano $RELEASE_TAG" --generate-notes
          fi
          mkdir existing-assets
          for asset in install.sh install.ps1 update.sh update.ps1 update-check.py compose.yaml SHA256SUMS; do
            if gh release download "$RELEASE_TAG" --pattern "$asset" --dir existing-assets; then
              cmp "release-assets/$asset" "existing-assets/$asset"
            else
              gh release upload "$RELEASE_TAG" "release-assets/$asset"
            fi
          done
          gh release edit "$RELEASE_TAG" --draft=false
