# Glosano production compose stack.
# For dev overrides (hot reload, bind mounts, frontend Vite server) use:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

name: glosano

# Shared by app-api and app-worker. Values come from .env next to this file;
# see docs/self-hosting.md for what each one does.
x-app-env: &app-env
  GLOSANO_ENV: ${GLOSANO_ENV:-prod}
  GLOSANO_LOG_LEVEL: ${GLOSANO_LOG_LEVEL:-INFO}
  GLOSANO_SECRET_KEY: ${GLOSANO_SECRET_KEY:?set GLOSANO_SECRET_KEY in .env (openssl rand -hex 32)}
  GLOSANO_DATABASE_URL: ${GLOSANO_DATABASE_URL:-postgresql+asyncpg://flinq:flinq@postgres:5432/flinq}
  GLOSANO_REDIS_URL: ${GLOSANO_REDIS_URL:-redis://redis:6379/0}
  GLOSANO_DATA_DIR: /var/lib/glosano
  GLOSANO_ALLOW_PUBLIC_REGISTRATION: ${GLOSANO_ALLOW_PUBLIC_REGISTRATION:-true}
  GLOSANO_INITIAL_ADMIN_EMAIL: ${GLOSANO_INITIAL_ADMIN_EMAIL:-}
  GLOSANO_LLM_FORCE_DISABLED: ${GLOSANO_LLM_FORCE_DISABLED:-false}
  GLOSANO_LLM_ENABLED: ${GLOSANO_LLM_ENABLED:-false}
  GLOSANO_LLM_BASE_URL: ${GLOSANO_LLM_BASE_URL:-}
  GLOSANO_LLM_API_KEY: ${GLOSANO_LLM_API_KEY:-}
  GLOSANO_LLM_MODEL: ${GLOSANO_LLM_MODEL:-}
  GLOSANO_LLM_TIMEOUT_SECONDS: ${GLOSANO_LLM_TIMEOUT_SECONDS:-30}
  GLOSANO_OCR_ENABLED: ${GLOSANO_OCR_ENABLED:-false}
  GLOSANO_OCR_BASE_URL: ${GLOSANO_OCR_BASE_URL:-}
  GLOSANO_OCR_API_KEY: ${GLOSANO_OCR_API_KEY:-}
  # LingQ vocabulary import; the user's LingQ token is entered per import, never set here.
  GLOSANO_LINGQ_BASE_URL: ${GLOSANO_LINGQ_BASE_URL:-https://www.lingq.com}
  GLOSANO_LINGQ_TIMEOUT_SECONDS: ${GLOSANO_LINGQ_TIMEOUT_SECONDS:-30}
  GLOSANO_LINGQ_PAGE_DELAY_SECONDS: ${GLOSANO_LINGQ_PAGE_DELAY_SECONDS:-1}
  # Read by uvicorn: which proxies may set X-Forwarded-For (real client IP for
  # login rate limits) and X-Forwarded-Proto.
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flinq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flinq}
      POSTGRES_DB: ${POSTGRES_DB:-flinq}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flinq} -d ${POSTGRES_DB:-flinq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-api:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *app-env
    volumes:
      - app_data:/var/lib/glosano
    ports:
      # A bare port listens on every interface; behind a reverse proxy on the
      # same host use GLOSANO_BIND=127.0.0.1:8000.
      - "${GLOSANO_BIND:-8000}:8000"
    command: ["glosano", "serve", "--host", "0.0.0.0", "--port", "8000"]

  app-worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *app-env
    volumes:
      - app_data:/var/lib/glosano
    command: ["glosano", "worker"]

volumes:
  postgres_data:
  redis_data:
  app_data: