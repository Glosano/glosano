# Glosano release stack. Requires Docker Compose v2.20+ (Docker Standalone).
# Set the variables in .env or in Portainer Stack environment variables.
name: ${COMPOSE_PROJECT_NAME:-glosano}

# Shared by app-api and app-worker. Values come from .env next to this file;
# see docs/self-hosting.md for what each one does.
x-app-env: &app-env
  GLOSANO_ENV: prod
  GLOSANO_LOG_LEVEL: ${GLOSANO_LOG_LEVEL:-INFO}
  GLOSANO_SECRET_KEY: ${GLOSANO_SECRET_KEY:?set GLOSANO_SECRET_KEY in .env (openssl rand -hex 32)}
  GLOSANO_DATABASE_URL: postgresql+asyncpg://glosano:${POSTGRES_PASSWORD:?set a random hexadecimal POSTGRES_PASSWORD}@postgres:5432/glosano
  GLOSANO_REDIS_URL: ${GLOSANO_REDIS_URL:-redis://redis:6379/0}
  GLOSANO_DATA_DIR: /var/lib/glosano
  GLOSANO_ALLOW_PUBLIC_REGISTRATION: ${GLOSANO_ALLOW_PUBLIC_REGISTRATION:-false}
  GLOSANO_INITIAL_ADMIN_EMAIL: ${GLOSANO_INITIAL_ADMIN_EMAIL:-}
  GLOSANO_LLM_ENABLED: ${GLOSANO_LLM_ENABLED:-false}
  GLOSANO_LLM_BASE_URL: ${GLOSANO_LLM_BASE_URL:-}
  GLOSANO_LLM_API_KEY: ${GLOSANO_LLM_API_KEY:-}
  GLOSANO_LLM_MODEL: ${GLOSANO_LLM_MODEL:-}
  GLOSANO_LLM_TIMEOUT_SECONDS: ${GLOSANO_LLM_TIMEOUT_SECONDS:-30}
  GLOSANO_OCR_ENABLED: ${GLOSANO_OCR_ENABLED:-false}
  GLOSANO_OCR_BASE_URL: ${GLOSANO_OCR_BASE_URL:-}
  GLOSANO_OCR_API_KEY: ${GLOSANO_OCR_API_KEY:-}
  # LingQ vocabulary import; the user's LingQ token is entered per import, never set here.
  GLOSANO_LINGQ_BASE_URL: ${GLOSANO_LINGQ_BASE_URL:-https://www.lingq.com}
  GLOSANO_LINGQ_TIMEOUT_SECONDS: ${GLOSANO_LINGQ_TIMEOUT_SECONDS:-30}
  GLOSANO_LINGQ_PAGE_DELAY_SECONDS: ${GLOSANO_LINGQ_PAGE_DELAY_SECONDS:-1}
  # Read by uvicorn: which proxies may set X-Forwarded-For (real client IP for
  # login rate limits) and X-Forwarded-Proto.
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glosano
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a random hexadecimal POSTGRES_PASSWORD}
      POSTGRES_DB: glosano
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glosano -d glosano"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ${GLOSANO_IMAGE:-ghcr.io/glosano/glosano}:${GLOSANO_VERSION:?set a release version such as v0.0.1}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-env
    command: ["alembic", "upgrade", "head"]

  app-api:
    image: ${GLOSANO_IMAGE:-ghcr.io/glosano/glosano}:${GLOSANO_VERSION:?set a release version such as v0.0.1}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *app-env
    volumes:
      - app_data:/var/lib/glosano
    ports:
      # A bare port listens on every interface; behind a reverse proxy on the
      # same host use GLOSANO_BIND=127.0.0.1:8000.
      - "${GLOSANO_BIND:-127.0.0.1:8000}:8000"
    command: ["glosano", "serve", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 20s

  app-worker:
    image: ${GLOSANO_IMAGE:-ghcr.io/glosano/glosano}:${GLOSANO_VERSION:?set a release version such as v0.0.1}
    restart: unless-stopped
    depends_on:
      app-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *app-env
    volumes:
      - app_data:/var/lib/glosano
    command: ["glosano", "worker"]

volumes:
  postgres_data:
  redis_data:
  app_data:
